name: Build Loopline APK

on:
  push:
    branches:
      - "claude/great-lamport-on5sx5"
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests (logic + Robolectric smoke)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/loopline-debug.apk
          rel=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n1)
          if [ -n "$rel" ]; then cp "$rel" dist/loopline-release.apk; fi
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loopline-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Loopline build #${{ github.run_number }}"
          body: |
            Automated build of the Loopline Android game.

            Download **loopline-debug.apk**, enable "Install from unknown sources",
            and install it on any Android 8.0+ device.
          files: dist/*.apk

  smoke-emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: loopline-apks
          path: apks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Daily-Challenge smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: false
          script: |
            set -x
            adb install -r apks/loopline-debug.apk
            adb logcat -c
            # Launch the daily challenge directly (GameActivity is exported in debug builds)
            adb shell am start -W -n com.loopline.game.debug/com.loopline.game.ui.GameActivity --ez extra_daily true
            sleep 12
            adb logcat -d > logcat-full.txt
            echo "=== scanning logcat for crashes ==="
            if grep -q "FATAL EXCEPTION" logcat-full.txt; then
              echo "::error::App crashed on the Daily Challenge screen"
              grep -B3 -A80 "FATAL EXCEPTION" logcat-full.txt
              exit 1
            fi
            if grep -qE "signal 11 \(SIGSEGV\)|signal 6 \(SIGABRT\)" logcat-full.txt; then
              echo "::error::Native crash detected"
              grep -B3 -A60 -E "F DEBUG|SIGSEGV|SIGABRT|backtrace" logcat-full.txt
              exit 1
            fi
            echo "No crash detected after 12s on the Daily Challenge screen."

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat-full.txt
          if-no-files-found: warn
